name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate env template contract
        run: npm run preflight:template

      - name: Run env validation tests
        run: npm run test:env

      - name: Run Twilio reliability unit tests
        run: npm run test:twilio-unit

      - name: Lint
        run: npm run lint
